<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="{{ url_for('static', filename='img/icone.ico') }}" type="image/x-icon">
        <title>Family Dental Clinic</title>
        <script src="https://kit.fontawesome.com/0d0e7ded81.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">

        <script>
            window.onload = function(){
                {% with messages = get_flashed_messages(with_categories=True) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            alert("{{ message }}");  // Exibe a mensagem como alert
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            }
        </script>
        {% block head %}
        {% endblock %}
    </head>
    <body>
        <nav class="nav">
            <img src="{{ url_for('static', filename='img/logo.png')}}" alt="">
            {% for link in links %}
                <a href="{{ link.rota }}"><i class="{{ link.icone }}"></i>{{ link.texto }}</a>
            {% endfor %}
            <a href="/chamada"><i class="fa-solid fa-bell"></i>Chamada de Pacientes</a>
            <a href="/desconectar"><i class="fa-solid fa-door-open"></i>Desconectar</a>
            {% if links|length > 1 %}
                <a href="/trocar-senha"><i class="fa-solid fa-key"></i> Trocar Senha</a>
            {% endif %}
        </nav>
        <div class="main-container">
            {% block body %}
            {% endblock %}
        </div>
    </body>
</html>
