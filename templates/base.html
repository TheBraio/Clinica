<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://kit.fontawesome.com/0d0e7ded81.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">

        {% block head %}
        {% endblock %}
    </head>
    <body>
        <nav class="nav">
            <img src="{{ url_for('static', filename='img/logo.png')}}" alt="">
            {% for link in links %}
                <!-- <a href="{{href}}"><i class="{{ icone }}"></i></i>{{ text }}</a> -->
                <!-- <a href="/doutor"><i class="fa-solid fa-user-doctor"></i>Doutor</a> -->
                <a href="{{ link.rota }}"><i class="{{ link.icone }}"></i>{{ link.texto }}</a>
            {% endfor %}
            <a href="/chamada"><i class="fa-solid fa-bell"></i>Chamada de Pacientes</a>
        </nav>
        <div class="main-container">
            {% block body %}
            {% endblock %}
        </div>
    </body>
</html>
