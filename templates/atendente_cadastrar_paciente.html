{% extends 'base.html' %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/atendente_cadastrar_paciente.css') }}">
    <script>
        window.onload = function(){
            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    {% for category, message in messages %}
                        alert("{{ message }}");  // Exibe a mensagem como alert
                    {% endfor %}
                {% endif %}
            {% endwith %}
        }
    </script>
{% endblock %}

{% block body %}
    <span class="title">Cadastro de pacientes</span>
    <form action="/crud/pacientes", method="POST">
        <div class="container1">
            <span class="subtitle">Informações</span>

            <label for="nome">Nome</label>
            <input type="text" id='nome' name="nome" class="gap" required>

            <label for="CPF">CPF</label>
            <input type="text" id='CPF' name='CPF' class="gap" required>

            <label for="desc">Descrição</label>
            <input type="text" id='desc' name='descricao' class="gap" required>

            <!-- <span class="subtitle">Consulta</span>

            <div class="container-consulta">
                <div style="display:flex; flex-direction: column; width: 45%">
                    <label for="data">Data</label>
                    <input type="date" id='data'>
                </div>
                <div style="display:flex; flex-direction: column; width: 45%">
                    <label for="horario">Horario</label>
                    <input type="time" id='horario'>
                </div>
            </div> -->
            <button type="submit">Enviar</button>
        </div>
    </form>
{% endblock %}
